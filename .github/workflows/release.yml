name: Release

# Push a tag like v0.1.0 (must match versionName in app/build.gradle.kts) to build a signed
# APK and attach it to a GitHub Release, which Obtainium can track.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Check tag matches versionName
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          APODROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          APODROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APODROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APODROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :core:test :app:assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "apodroid-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "apodroid-$GITHUB_REF_NAME.apk" --title "$GITHUB_REF_NAME" --generate-notes
